<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IkyVIP - Link Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Fredoka', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            padding: 16px;
            background: #FFF9E6; /* Warna latar belakang cerah bertema kartun */
        }

        /* Animated cartoon shapes - SVG-like blobs */
        .cartoon-blob {
            position: fixed;
            border: 3px solid #000000;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
        }

        .blob-1 {
            width: 200px;
            height: 200px;
            background: #FF6B6B;
            top: 5%;
            left: 5%;
            border-radius: 47% 53% 42% 58% / 61% 45% 55% 39%;
            animation: blob-float 8s ease-in-out infinite;
            box-shadow: 0 6px 0px #000000;
        }

        .blob-2 {
            width: 170px;
            height: 170px;
            background: #4ECDC4;
            top: 55%;
            right: 5%;
            border-radius: 32% 68% 58% 42% / 48% 51% 49% 52%;
            animation: blob-float 10s ease-in-out infinite reverse;
            box-shadow: 0 5px 0px #000000;
        }

        .blob-3 {
            width: 140px;
            height: 140px;
            background: #FFE66D;
            bottom: 5%;
            left: 8%;
            border-radius: 58% 42% 51% 49% / 42% 55% 45% 58%;
            animation: blob-float 9s ease-in-out infinite;
            box-shadow: 0 4px 0px #000000;
        }

        .blob-4 {
            width: 160px;
            height: 160px;
            background: #FF9F43;
            top: 15%;
            right: 10%;
            border-radius: 45% 55% 63% 37% / 52% 48% 52% 48%;
            animation: blob-float 11s ease-in-out infinite reverse;
            box-shadow: 0 5px 0px #000000;
        }

        /* Cartoon lines/doodles */
        .doodle-line {
            position: fixed;
            border: 2px solid #000000;
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
        }

        .line-1 {
            width: 220px;
            height: 3px;
            top: 25%;
            left: 2%;
            transform: rotate(-15deg);
            border-radius: 10px;
        }

        .line-2 {
            width: 170px;
            height: 3px;
            bottom: 30%;
            right: 3%;
            transform: rotate(25deg);
            border-radius: 10px;
        }

        /* Cartoon circles */
        .doodle-circle {
            position: fixed;
            border: 2px solid #000000;
            border-radius: 50%;
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
        }

        .circle-1 {
            width: 110px;
            height: 110px;
            top: 40%;
            right: 8%;
        }

        .circle-2 {
            width: 90px;
            height: 90px;
            bottom: 20%;
            left: 5%;
        }

        @keyframes blob-float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(10deg); }
        }

        @keyframes bounce-icon {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(3deg); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cartoon-card {
            background: #FFFEF5;
            border: 4px solid #000000;
            box-shadow: 0 8px 0px #000000, 0 12px 15px rgba(0,0,0,0.25);
            border-radius: 25px;
            animation: slide-in 0.5s ease-out;
            position: relative;
            z-index: 10;
        }

        .cartoon-link {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFFDF5 100%);
            border: 3px solid #000000;
            box-shadow: 0 5px 0px #000000, 0 7px 12px rgba(0,0,0,0.15);
            border-radius: 18px;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .cartoon-link:hover {
            transform: translate(-3px, -4px) scale(1.03);
            box-shadow: 0 8px 0px #000000, 0 10px 18px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #FFFDF5 0%, #FFE66D 100%);
        }

        .cartoon-link:active {
            transform: translate(2px, 3px) scale(0.98);
            box-shadow: 0 2px 0px #000000;
        }

        .cartoon-icon {
            border: 2px solid #000000;
            box-shadow: 0 3px 0px #000000;
            border-radius: 12px;
            animation: bounce-icon 2s ease-in-out infinite;
        }

        .cartoon-arrow {
            border: 2px solid #000000;
            box-shadow: 0 3px 0px #000000;
            border-radius: 50%;
            animation: wiggle 1.5s ease-in-out infinite;
            transition: transform 0.3s;
        }

        .cartoon-link:hover .cartoon-arrow {
            transform: translateX(6px) scale(1.15);
        }

        .cartoon-warning {
            background: linear-gradient(135deg, #FFE4E6 0%, #FFB3BA 100%);
            border: 3px solid #FF0000;
            box-shadow: 0 5px 0px #FF0000, 0 7px 12px rgba(255,0,0,0.15);
            border-radius: 18px;
        }

        .profile-img {
            background: linear-gradient(135deg, #FFE66D 0%, #FF6B6B 100%);
            border: 3px solid #000000;
            box-shadow: 0 6px 0px #000000, 0 8px 15px rgba(0,0,0,0.2);
            animation: bounce-icon 2.5s ease-in-out infinite;
        }

        .title-text {
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            letter-spacing: 1.5px;
            animation: wiggle 2s ease-in-out infinite;
            margin: 0;
        }

        .subtitle-text {
            font-weight: 700;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.08);
            letter-spacing: 0.5px;
            margin: 4px 0 0 0;
        }

        .divider {
            height: 2px;
            background: #000000;
            border-radius: 10px;
            box-shadow: 0 3px 0px rgba(0,0,0,0.15);
            margin: 12px 0;
        }

        /* Warna spesifik ikon yang disesuaikan */
        .icon-tg { background: linear-gradient(135deg, #0088cc, #229ED9); }
        .icon-ch { background: linear-gradient(135deg, #25D366, #128C7E); }
        .icon-gb { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
        .icon-wa { background: linear-gradient(135deg, #25D366, #20BA63); }
        .icon-wa2 { background: linear-gradient(135deg, #059669, #10B981); }
        .icon-donate { background: linear-gradient(135deg, #FF5722, #FF7043); }

        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.25s; }
        .delay-6 { animation-delay: 0.3s; }

        .link-title {
            font-weight: 800;
            font-size: 0.95rem;
            display: block;
            line-height: 1.1;
        }

        .link-subtitle {
            font-weight: 600;
            font-size: 0.65rem;
            color: #666;
            display: block;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
